name: CI

# Runs on every push and on every pull request into main.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  # Non-secret configuration shared by the jobs below
  VITE_API_URL: http://localhost:8000/api
  DJANGO_DEBUG: "True"
  AUTH_THROTTLE_RATE: 1000/min

jobs:
  backend:
    name: Backend tests (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies with pip
        run: pip install -r requirements.txt
      - name: Check that migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Run Django tests
        run: python manage.py test

  frontend:
    name: Frontend tests and build (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies with npm
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build

  playwright:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      DJANGO_DEBUG: "True"
      DJANGO_ALLOW_INSECURE_KEY: "True"
      VITE_API_URL: http://127.0.0.1:8000/api
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      AUTH_THROTTLE_RATE: 1000/min

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Run database migrations
        working-directory: backend
        run: python manage.py migrate

      - name: Start Django backend
        working-directory: backend
        run: |
          nohup python manage.py runserver 127.0.0.1:8000 > /tmp/django.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health/; then
              echo "Django backend is ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/django.log
          exit 1

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        run: npm run test:e2e -- --workers=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend, playwright]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          push: false
          tags: workflowhub-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          push: false
          tags: workflowhub-frontend:ci
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the backend container
        run: |
          docker run -d --name api -p 8000:8000 -e DJANGO_SECRET_KEY=${{ github.run_id }}-ci-only-key workflowhub-backend:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/api/health/ && exit 0
            sleep 2
          done
          docker logs api
          exit 1
